# Local synthetic database checks, using the recorded Supabase CLI.
project_id = "sfda-arm-dev"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 100

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = true

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = [
  'http://127.0.0.1:5173/auth/setup\?operationId=*&generation=*&setupCapability=*',
  'http://127.0.0.1:5173/auth/recovery\?operationId=*&revision=*&capability=*',
]
# Spec 0006 bounds an issued access token to 15 minutes; it is not instant revocation.
jwt_expiry = 900
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.rate_limit]
# The initial small pilot email quota. It applies only with custom SMTP, so local capture is
# unaffected; production records its own effective setting.
email_sent = 60

[auth.email]
# The CLI maps this to email provider enablement. Global signup stays disabled.
enable_signup = true
enable_confirmations = false

[auth.email.template.invite]
subject = "Set your SFDA password"
content_path = "./supabase/templates/invite.html"

[auth.email.template.recovery]
subject = "Your SFDA password link"
content_path = "./supabase/templates/recovery.html"

[edge_runtime]
enabled = false

[analytics]
enabled = false
