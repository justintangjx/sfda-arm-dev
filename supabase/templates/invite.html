<!doctype html>
<html lang="en">
  <body>
    <h1>Set your SFDA password</h1>
    <p>
      Your admin has prepared your account. You can choose your own password.
    </p>
    <p>
      <a
        href="{{ .RedirectTo }}&amp;token_hash={{ .TokenHash }}&amp;type=invite"
      >
        Set password
      </a>
    </p>
    <p>
      If this link is no longer valid, you can ask your admin for a replacement.
    </p>
  </body>
</html>
