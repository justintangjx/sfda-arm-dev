<!doctype html>
<html lang="en">
  <body>
    <h1>Choose your SFDA password</h1>
    <p>
      A password link was requested for your account. You can choose your own
      password. Any earlier SFDA password link no longer works.
    </p>
    <p>
      <a
        href="{{ .RedirectTo }}&amp;token_hash={{ .TokenHash }}&amp;type=recovery"
      >
        Choose password
      </a>
    </p>
    <p>
      If you did not ask for this, you can ignore this email. Your current
      password stays unchanged.
    </p>
  </body>
</html>
