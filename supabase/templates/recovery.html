<!doctype html>
<html lang="en">
  <body>
    <h1>Set your SFDA password</h1>
    <p>
      Your admin requested a replacement password setup link for your account.
    </p>
    <p>
      <a
        href="{{ .RedirectTo }}&amp;token_hash={{ .TokenHash }}&amp;type=recovery"
      >
        Set password
      </a>
    </p>
    <p>
      If this link is no longer valid, you can ask your admin for a replacement.
    </p>
  </body>
</html>
